# ローカルでフルスタックを再現する compose。
#   db(pgvector) + backend(FastAPI) + frontend(Next.js) + minio(S3互換・原本保存)
# 前提: backend/.env を用意しておく（cp backend/.env.example backend/.env → キー記入）
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # ★名前付きボリューム：ベクトルDBを永続化
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      timeout: 3s
      retries: 10

  # S3のローカル再現。原本ファイル（PDF・抽出画像）の保存先。
  # コンソール: http://localhost:9001 （minioadmin / minioadmin）
  minio:
    # 再現性のためリリースタグを固定（db の pgvector:pg16 と同じ方針）
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 管理コンソール
    volumes:
      - miniodata:/data # ★名前付きボリューム：原本を永続化（pgdataと同じ扱い）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 起動時にバケットを作るだけの一発コンテナ（作成済みなら何もしない）
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z  # minio本体と同様にタグ固定
    depends_on:
      minio:
        condition: service_healthy
    # --ignore-existing: バケットが既にあってもエラーにせず正常終了させる（再実行に耐える）
    # ※ -p は --ignore-existing の短縮形なので併用不可。長い方だけを使う。
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/rag-docs
      "

  backend:
    build: ./backend
    env_file:
      - ./backend/.env # ANTHROPIC_API_KEY / VOYAGE_API_KEY 等
    environment:
      # compose 内では db サービス名で接続（.env の localhost 設定を上書き）
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      # compose 内では minio サービス名で接続（本番はこの変数を消せば実S3に向く）
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: rag-docs
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/seed_docs:/app/seed_docs # seed用の文書（ホストで足せる）
      - ./backend/seed_data:/app/seed_data # seed用の初期データ（評価質問の fixture）
      # 評価専用コーパス（task seed-corpus が読む文書・区分・質問集）。
      # イメージには COPY していない（評価用でアプリの実行には要らない）ので、
      # これが無いと seed-corpus が FileNotFoundError で落ちる。
      - ./backend/eval_corpus:/app/eval_corpus

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000 # プロキシ先を backend サービスへ
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: # `task downv`（down -v）で削除、`task down` では残る
  miniodata:
