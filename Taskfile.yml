# go-task (https://taskfile.dev) のタスク定義。`task <name>` で実行。
# 新しい操作を足したいときは tasks: 配下に1エントリ増やすだけ（拡張可能）。
version: "3"

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  up:
    desc: 全サービス起動（db + backend + frontend をビルドして立ち上げ）
    cmds:
      - docker compose up -d --build

  test:
    desc: バックエンドの単体テストを実行（DB/外部API不要。稼働中スタックには触れない）
    cmds:
      # 現在のホストソースをマウントした使い捨てコンテナで pytest を回す。
      # --no-deps で db 等を起こさない。pytest はイメージに無いので都度入れる。
      # DATABASE_URL は到達不能な値で上書きする: compose の既定は db:5432 を指し、
      # `task up` 済みだと実DBに繋がってしまい「DB非依存」が崩れても気づけない。
      # ここが繋がらない前提なら、DBに触れたテストは即座に失敗して露見する。
      # eval_corpus も渡す: test_eval_corpus / test_corpus_cli がコーパスの中身
      # （文書数・紛らわしい文書対など）を直接読むので、無いと FileNotFoundError。
      - >
        docker compose run --rm --no-deps
        -e ANTHROPIC_API_KEY=dummy -e VOYAGE_API_KEY=dummy
        -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused
        -v "$PWD/backend/app:/app/app"
        -v "$PWD/backend/tests:/app/tests"
        -v "$PWD/backend/seed_data:/app/seed_data"
        -v "$PWD/backend/seed_docs:/app/seed_docs"
        -v "$PWD/backend/eval_corpus:/app/eval_corpus"
        -v "$PWD/backend/pytest.ini:/app/pytest.ini"
        -v "$PWD/backend/requirements.txt:/app/requirements.txt"
        -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt"
        backend sh -c "pip install -q -r requirements-dev.txt && python -m pytest"

  test-front:
    desc: フロントの単体テスト＋型チェック（ブラウザ不要。CIと同じ内容）
    dir: frontend
    cmds:
      # 対象は描画から切り離した純ロジック（app/sse.ts・app/citations.ts）。
      # DOMを使わないので jsdom 等は要らず、node だけで回る。
      - npm run test
      - npx tsc --noEmit

  lint:
    desc: FE + BE のlintをまとめて確認（CIと同じ内容。直すのは task fmt）
    cmds:
      - task: lint-back
      - task: lint-front

  lint-back:
    desc: バックエンドのlint（ruff。設定は backend/ruff.toml）
    cmds:
      # `task test` と同じく使い捨てコンテナで回す（ホストにPython環境を要求しない）。
      # ruff は requirements-dev.txt に入れてあるので、テストと同じ1行で揃う。
      - >
        docker compose run --rm --no-deps
        -e ANTHROPIC_API_KEY=dummy -e VOYAGE_API_KEY=dummy
        -v "$PWD/backend/app:/app/app"
        -v "$PWD/backend/tests:/app/tests"
        -v "$PWD/backend/ruff.toml:/app/ruff.toml"
        -v "$PWD/backend/requirements.txt:/app/requirements.txt"
        -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt"
        backend sh -c "pip install -q -r requirements-dev.txt && ruff check ."

  lint-front:
    desc: フロントのlint（ESLint。設定は frontend/.eslintrc.json）
    dir: frontend
    cmds:
      - npm run lint

  fmt:
    desc: lintの自動修正（import順の並べ替え等）。直せないものは task lint に残る
    cmds:
      - task: fmt-back
      - task: fmt-front

  fmt-back:
    desc: バックエンドのlintを自動修正（ruff --fix）
    cmds:
      # コンテナ内から書き戻すのでソースはマウントしたまま（-v で双方向）。
      # --fix は「意味が変わらない」と ruff が判断したものだけを直す。
      # 行が長すぎる等の直しようがないものは残るので、そこは手で直す。
      - >
        docker compose run --rm --no-deps
        -e ANTHROPIC_API_KEY=dummy -e VOYAGE_API_KEY=dummy
        -v "$PWD/backend/app:/app/app"
        -v "$PWD/backend/tests:/app/tests"
        -v "$PWD/backend/ruff.toml:/app/ruff.toml"
        -v "$PWD/backend/requirements.txt:/app/requirements.txt"
        -v "$PWD/backend/requirements-dev.txt:/app/requirements-dev.txt"
        backend sh -c "pip install -q -r requirements-dev.txt && ruff check . --fix"

  fmt-front:
    desc: フロントのlintを自動修正（eslint --fix）
    dir: frontend
    cmds:
      - npm run lint:fix

  down:
    desc: 停止（ベクトルDBのデータは残す）
    cmds:
      - docker compose down

  downv:
    desc: 停止 + ボリューム削除（ベクトルDBも消える。作り直したいとき）
    cmds:
      - docker compose down -v

  logs:
    desc: ログを追う
    cmds:
      - docker compose logs -f

  seed:
    desc: 初期データの投入（seed_docs/*.txt の文書 + 評価質問の fixture）。冪等
    cmds:
      - docker compose exec -T backend python -m app.seed
      # 評価質問(eval_questions)も同じ seed で入れる。文書だけ入って質問が空だと
      # `python -m app.eval` が「質問が見つかりません」で止まるため、セットで流す。
      - docker compose exec -T backend python -m app.eval --seed

  seed-corpus:
    desc: 評価専用コーパス（eval_corpus・数百チャンク）の文書と質問集を投入。冪等
    cmds:
      # ★デモ用の seed とは別コマンドにしている★
      # コーパスは指標を飽和させないために意図的に大きい（29文書 / 約270チャンク）。
      # `task seed` に混ぜると、UIを触るだけのときも毎回それを全部埋め込むことになり、
      # 時間とAPIの費用が常にかかる。measure したいときだけこちらを叩く。
      - docker compose exec -T backend python -m app.seed --corpus
      - docker compose exec -T backend python -m app.eval --seed --corpus

  eval-corpus:
    desc: 評価専用コーパスで検索を評価する（飽和していないか＝改善の余地が残るかを見る）
    cmds:
      - docker compose exec -T backend python -m app.eval --corpus

  compare-contextual:
    desc: contextual retrieval の有無で検索精度を比較する（seed_docs を2回取り込み直す）
    cmds:
      - docker compose exec -T backend python -m app.compare

  compare-contextual-corpus:
    desc: 同じ比較を評価専用コーパスで行う（数百チャンクを2回取り込む＝時間とAPI費用がかかる）
    cmds:
      # seed_docs（12チャンク）では Hit@4 が天井に張り付いて差が出ない。
      # 「効果がない」と「測れていない」を分けるにはこちらで測る。
      - docker compose exec -T backend python -m app.compare --corpus

  # 例: 単一ファイルだけ入れたいときのテンプレ（拡張の見本）
  # ingest-file:
  #   desc: 指定ファイルを1つ登録する（task ingest-file FILE=path/to/x.txt）
  #   cmds:
  #     - docker compose exec -T backend python -m app.seed "{{.FILE}}"
