# PRごとに単体テストを回す（backend / frontend を別チェックとして出す）。
#   backend:  ローカルの `task test` と同じ pytest を、コンテナではなく素のPythonで実行する
#   frontend: vitest（純ロジックのみ）＋ tsc の型チェック（`task test-front` と同じ）
#
# lint は別ワークフロー（lint.yml）。分けた理由はそちらのコメント参照。
#
# どちらも DB / 外部API を一切叩かない（tests/conftest.py がダミーキーを入れるだけ）ので、
# AWSにもAnthropic/Voyageにも課金は発生しない。publicリポジトリなのでActions実行時間も無料。
name: test

on:
  pull_request:
  push:
    branches: [main, develop] # マージ後のmainが壊れていないかも見る
  workflow_dispatch:

# 同じPRに連続pushしたとき、古い実行を打ち切って無駄な実行を減らす
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # backend/Dockerfile と揃える
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt は requirements.txt を -r で取り込むので、これ1本で足りる。
      # 本体依存も入れるのは、tests が app パッケージを import するため
      # （anthropic/voyageai/psycopg はクライアント構築のみで通信はしない）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # pytest.ini の pythonpath=. / testpaths=tests がそのまま効く
      - name: Run pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # frontend/Dockerfile と揃える
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # lockfile どおりに入れる（npm install と違い勝手に更新しない）
      - name: Install dependencies
        run: npm ci

      # 対象は描画から切り離した純ロジック（SSEの読み取り・引用の切り分け）。
      # ブラウザもDOMも要らないので、jsdom 等の追加依存なしで動く。
      - name: Run vitest
        run: npm run test

      # 型のズレも落とす。api-types.ts はバックエンドのOpenAPIから生成しているので、
      # BEのスキーマ変更にフロントが追随できていないとここで気づける。
      # ★lint側ではなくここに置いてある★のは、手元の `task test-front` が
      # vitest と tsc をまとめて回すため（CIと手元で同じ単位に保つ）。
      - name: Type check
        run: npx tsc --noEmit
